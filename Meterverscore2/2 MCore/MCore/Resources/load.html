<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MCore Loading</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #040810 0%, #0a1628 50%, #061020 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    img {
      max-width: 180px;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.4));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    h1 {
      font-size: 2.2em;
      font-weight: 700;
      letter-spacing: 6px;
      color: #00e5ff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.6), 0 0 60px rgba(0, 229, 255, 0.2);
      margin: 0 0 10px 0;
    }

    .subtitle {
      font-size: 0.75em;
      letter-spacing: 4px;
      color: rgba(160, 196, 232, 0.6);
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .dot-loader {
      display: flex;
      gap: 12px;
    }

    .dot-loader div {
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.8), 0 0 30px rgba(0, 229, 255, 0.3);
      animation: bounce 1.4s infinite ease-in-out;
    }

    .dot-loader div:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot-loader div:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.4;
      } 
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 35px rgba(0, 229, 255, 0.7)); }
    }
  </style>
</head>
<body>
  <img src="data:image/png;base64,[BASE-ICO]" onerror="this.style.display='none'" alt="Logo" />
  <h1>MCore</h1>
  <div class="subtitle">METERVERSCORE</div>
  <div class="dot-loader">
    <div></div>
    <div></div>
    <div></div>
  </div>
</body>
</html>
